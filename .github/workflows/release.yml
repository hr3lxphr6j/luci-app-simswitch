name: Build and release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          cd tests
          python3 -m unittest discover -v

  build:
    name: ${{ matrix.format }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: ipk
            sdk_release: '24.10.4'
          - format: apk
            sdk_release: '25.12.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches PKG_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^PKG_VERSION:=//p' Makefile)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match v$version" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget unzip zstd python3 python3-setuptools file swig

      - name: Download SDK
        env:
          FORMAT: ${{ matrix.format }}
          SDK_RELEASE: ${{ matrix.sdk_release }}
        run: |
          set -euo pipefail

          CANDIDATES="
          https://downloads.openwrt.org/releases/${SDK_RELEASE}/targets/x86/64
          https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/${SDK_RELEASE}/targets/x86/64
          "
          # A snapshot SDK still produces an apk that installs on 25.12.
          if [ "$FORMAT" = apk ]; then
            CANDIDATES="$CANDIDATES
          https://downloads.openwrt.org/snapshots/targets/x86/64"
          fi

          SDK_URL=
          for url in $CANDIDATES; do
            rm -f index.html
            if curl -fsSL --retry 3 --retry-delay 2 "$url/" -o index.html &&
               grep -qE 'openwrt-sdk-[^"<]*x86-64[^"<]*\.tar\.(zst|xz)' index.html; then
              SDK_URL=$url
              break
            fi
          done
          [ -n "$SDK_URL" ] || { echo 'no OpenWrt SDK index found' >&2; exit 1; }

          SDK_NAME=$(grep -oE 'openwrt-sdk-[^"<]*x86-64[^"<]*\.tar\.(zst|xz)' index.html | head -n1)
          echo "SDK: $SDK_URL/$SDK_NAME"
          curl -fL --retry 3 --retry-delay 2 "$SDK_URL/$SDK_NAME" -o sdk.tar

          mkdir -p sdk
          case "$SDK_NAME" in
            *.tar.zst) tar --zstd -xf sdk.tar -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf sdk.tar -C sdk --strip-components=1 ;;
          esac
          rm -f sdk.tar index.html

      - name: Copy package into the SDK
        run: |
          mkdir -p sdk/package/luci-app-simswitch
          git archive --format=tar HEAD | tar -x -C sdk/package/luci-app-simswitch

      - name: Install the LuCI feed
        run: |
          cd sdk
          ./scripts/feeds update luci
          ./scripts/feeds install -a -p luci

      - name: Build package
        run: |
          cd sdk
          make defconfig
          make -j"$(nproc)" package/luci-app-simswitch/compile V=s

      - name: Collect package
        run: |
          mkdir -p artifacts
          find sdk/bin -type f \( -name '*.ipk' -o -name '*.apk' \) \
            -name 'luci-app-simswitch*' -exec cp -v {} artifacts/ \;
          ls -l artifacts
          test -n "$(ls -A artifacts)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-simswitch-${{ matrix.format }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download IPK artifact
        uses: actions/download-artifact@v4
        with:
          name: luci-app-simswitch-ipk
          path: artifacts

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: luci-app-simswitch-apk
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          files=$(find . -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) | sort)
          [ -n "$files" ] || { echo 'no packages found' >&2; exit 1; }
          sha256sum $files > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: luci-app-simswitch ${{ github.ref_name }}
          files: artifacts/*
          body: |
            Installable packages for `luci-app-simswitch` ${{ github.ref_name }}.

            | Firmware | Package | Install |
            | --- | --- | --- |
            | OpenWrt 24.10 and earlier (opkg) | `.ipk` | `opkg install ./luci-app-simswitch_*.ipk` |
            | OpenWrt 25.12+ (apk) | `.apk` | `apk add --allow-untrusted ./luci-app-simswitch-*.apk` |

            Both packages are architecture-independent (`PKGARCH:=all`).
            Dependencies: `luci-base`, `rpcd`, `ubus`, `jsonfilter`, `uci`.

            The LuCI page is under **Cellular -> SIM profiles**; the CLI is
            `simswitch`. No profiles are configured by default; edit
            `/etc/config/simswitch` before switching.

            See `SHA256SUMS` for checksums.
